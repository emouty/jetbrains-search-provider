changelog:
  categories:
    - title: 🚀 Features
      labels:
        - enhancement
    - title: 🐛 Bug Fixes
      labels:
        - bug
    - title: 🧰 Other Changes
      labels:
        - '*'
      exclude:
        authors:
          - 'renovate[bot]'
          - 'renovate'
    - title: 🛠️ Dependencies
      labels:
        - '*'

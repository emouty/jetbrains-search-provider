name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.2.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    # the job pushes HEAD to main: a dispatch from another branch would bypass review
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      # never interpolate the raw input into a run: block
      VERSION: ${{ github.event.inputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm

      - run: npm ci

      - name: Bump version
        run: npm version "$VERSION" --no-git-tag-version

      - name: Ensure packaging tools
        run: sudo apt-get install -y libglib2.0-bin zip

      - run: npm run pack

      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: release $VERSION"
          git tag "$VERSION"
          git push origin HEAD:main
          git push origin "$VERSION"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # drop rolling draft (see draft-release.yml); its notes are superseded by this release
          gh release list --json tagName,isDraft \
            -q '.[] | select(.isDraft) | .tagName' |
            xargs -r -n1 gh release delete --yes
          gh release create "$VERSION" \
            jetbrains-search-provider.zip \
            --title "$VERSION" \
            --generate-notes

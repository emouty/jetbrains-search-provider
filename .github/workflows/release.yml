name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.2.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    # the job commits to main: a dispatch from another branch would bypass review
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      # never interpolate the raw input into a run: block
      VERSION: ${{ github.event.inputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm

      - run: npm ci

      - name: Bump version
        run: npm version "$VERSION" --no-git-tag-version

      - name: Ensure packaging tools
        run: sudo apt-get install -y libglib2.0-bin zip

      - run: npm run pack

      - name: Commit and tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # committed through the API so GitHub signs it: the main ruleset requires signed commits
          oid=$(jq -n \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg head "$GITHUB_SHA" \
            --arg msg "chore: release $VERSION" \
            --rawfile pkg package.json \
            --rawfile lock package-lock.json \
            '{query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid } } }",
              variables: {input: {
                branch: {repositoryNameWithOwner: $repo, branchName: "main"},
                expectedHeadOid: $head,
                message: {headline: $msg},
                fileChanges: {additions: [
                  {path: "package.json", contents: ($pkg | @base64)},
                  {path: "package-lock.json", contents: ($lock | @base64)}]}}}}' |
            gh api graphql --input - --jq .data.createCommitOnBranch.commit.oid)
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$VERSION" -f sha="$oid"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # drop rolling draft (see draft-release.yml); its notes are superseded by this release
          gh release list --json tagName,isDraft \
            -q '.[] | select(.isDraft) | .tagName' |
            xargs -r -n1 gh release delete --yes
          gh release create "$VERSION" \
            jetbrains-search-provider.zip \
            --title "$VERSION" \
            --generate-notes

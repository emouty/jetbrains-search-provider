name: Draft Release

# push (not pull_request: closed) so merged fork PRs also run with a writable token
on:
  push:
    branches: [ main ]

concurrency:
  group: draft-release
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create or refresh draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          latest=$(git tag --sort=-v:refname | head -1)
          IFS=. read -r major minor _ <<< "${latest:-0.0.0}"
          next="$major.$((minor + 1)).0"
          # single rolling draft: drop the old one so notes regenerate
          gh release list --json tagName,isDraft \
            -q '.[] | select(.isDraft) | .tagName' |
            xargs -r -n1 gh release delete --yes
          gh release create "$next" --draft --generate-notes \
            ${latest:+--notes-start-tag "$latest"} \
            --target main --title "$next"

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run build

      - run: npm test

      - name: Ensure packaging tools
        run: sudo apt-get install -y libglib2.0-bin zip

      - run: npm run pack

      - uses: actions/upload-artifact@v4
        with:
          name: jetbrains-search-provider
          path: jetbrains-search-provider.zip
          if-no-files-found: error

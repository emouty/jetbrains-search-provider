name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read
  actions: read
  checks: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run build

      - run: npm run typecheck:test

      - run: npm test

      # Fork PRs get a read-only token, which cannot create check runs.
      - uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3.2.0
        if: ${{ !cancelled() && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) }}
        with:
          name: Tests
          path: reports/junit.xml
          reporter: jest-junit
          # the default (true) writes a job summary instead of creating the check run
          use-actions-summary: 'false'

      - name: Ensure packaging tools
        run: sudo apt-get install -y libglib2.0-bin zip

      # Validates packaging works; the zip is published on release (see release.yml).
      - run: npm run pack

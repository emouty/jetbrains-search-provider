name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run build

      - run: npm run typecheck:test

      - run: npm test

      # Published as a check by test-report.yml, which has the write token fork PRs lack.
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: test-results
          path: reports/junit.xml

      - name: Ensure packaging tools
        run: sudo apt-get install -y libglib2.0-bin zip

      # Validates packaging works; the zip is published on release (see release.yml).
      - run: npm run pack
